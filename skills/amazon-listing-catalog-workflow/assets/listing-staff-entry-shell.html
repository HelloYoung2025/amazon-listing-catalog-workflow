<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#d5deea;--paper:#fff;--bg:#f3f6fa;--navy:#123b67;--green:#067647;--amber:#9a5b00;--red:#b42318}
    *{box-sizing:border-box}html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}body{max-width:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
    .skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:3;background:#fff;padding:8px}
    header{padding:28px 3vw;color:#fff;background:linear-gradient(125deg,#0d2c4f,#1d5f96)}header h1{margin:0;font-size:clamp(25px,3vw,42px)}header p{max-width:1200px;margin:7px 0 0;color:#dbeafe}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{padding:5px 10px;border:1px solid rgba(255,255,255,.4);border-radius:999px}
    main{width:100%;padding:20px 3vw 48px}.banner{padding:15px 18px;border:2px solid;border-radius:12px}.banner.pass{color:#075b39;background:#e9f8f1;border-color:#53b895}.banner.blocked{color:#7a271a;background:#ffebe9;border-color:#d92d20}.banner.conditional{color:#6b4100;background:#fff4d6;border-color:#d49a20}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}.card{grid-column:span 12;min-width:0;padding:19px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 8px 24px rgba(15,23,42,.045)}.half{grid-column:span 6}.third{grid-column:span 4}
    h2{margin:0 0 10px;color:var(--navy);font-size:21px}p{margin:6px 0}.muted{color:var(--muted)}.receipt-flow ol{margin:10px 0;padding-left:22px}.receipt-flow li{margin:7px 0}.table-wrap{width:100%;max-width:100%;overflow:auto}.table-wrap:focus-visible{outline:3px solid #2e90fa;outline-offset:3px}table{width:100%;border-collapse:collapse;font-size:13px}caption{padding:0 0 8px;text-align:left;color:var(--muted);font-weight:600}th,td{padding:8px;border:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#eef4fb;color:#173b67}.state{font-weight:750}.state.PASS{color:var(--green)}.state.BLOCKED,.state.FAIL,.state.NOT_AUTHORIZED{color:var(--red)}.state.CONDITIONAL,.state.HOLD{color:var(--amber)}code{overflow-wrap:anywhere}.errors li{margin:5px 0}dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:8px 12px;margin:0}dt{font-weight:700;color:var(--navy)}dd{min-width:0;margin:0;overflow-wrap:anywhere}
    footer{padding:18px 3vw 28px;color:var(--muted)}
    @media(max-width:768px){main,header{padding-left:18px;padding-right:18px}.half,.third{grid-column:span 12}.card{padding:15px}table{min-width:720px}}
    @media(max-width:390px){body{font-size:14px}header h1{font-size:24px}.meta{display:block}.pill{display:block;margin-top:6px}main,header,footer{padding-left:12px;padding-right:12px}.card{padding:12px}.table-wrap{max-width:calc(100vw - 48px)}dl{grid-template-columns:1fr}}
    @media print{body{background:#fff;color:#000;overflow:visible}header{color:#000;background:#fff;border-bottom:2px solid #000}header p{color:#333}.grid{display:block}.card{margin:0 0 12px;box-shadow:none;break-inside:auto}.responsibility,.banner{break-inside:avoid}main{padding:14px 0}.table-wrap{overflow:visible}table{min-width:0;font-size:9pt}a{color:#000;text-decoration:none}}
  </style>
</head>
<body>
  <a class="skip" href="#report">跳到报告正文</a>
  <header>
    <h1>{{TITLE}}</h1>
    <p>内部只读优化稿。事实、待核实主张与适用范围见正文；本页不代表后台发布或正式校验通过。</p>
    <div class="meta">{{META}}</div>
  </header>
  <main id="report">
    <section class="banner {{BANNER_CLASS}}" aria-label="验证结论"><strong>{{BANNER_TITLE}}</strong><p>{{BANNER_BODY}}</p></section>
    <div class="grid">
      {{CONTENT}}
    </div>
  </main>
  <footer>内部方案 · 平台规则以任务当日核实结果为准 · 未执行 Amazon 或 ERP 写入。</footer>
</body>
</html>
